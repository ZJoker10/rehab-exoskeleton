# Impedance Control Gains
# Tuned per patient and therapy phase

default:
  stiffness: [100.0, 80.0]  # Nm/rad
  damping: [10.0, 8.0]      # Nm*s/rad
  inertia: [0.5, 0.3]       # kg*m^2
  assist_ratio: 0.5

early_phase:  # Passive/more assistance
  stiffness: [150.0, 120.0]
  damping: [15.0, 12.0]
  inertia: [0.5, 0.3]
  assist_ratio: 0.8

mid_phase:    # Moderate assistance
  stiffness: [100.0, 80.0]
  damping: [10.0, 8.0]
  inertia: [0.5, 0.3]
  assist_ratio: 0.5

late_phase:   # Minimal assistance, active
  stiffness: [50.0, 40.0]
  damping: [6.0, 5.0]
  inertia: [0.5, 0.3]
  assist_ratio: 0.2
